# Gradle
org.gradle.jvmargs=-Xmx2G
# Parallel builds off: with two loader projects, a parallel build would
# launch their game-test runs, and so two Minecraft JVMs, at the same time.
org.gradle.parallel=false
# Fabric Loom + IntelliJ are not yet fully compatible with the configuration
# cache: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft target: `./gradlew build` builds mc (below); `-Pmc=26.3` builds
# another. The shared sources are written for mc_canonical and other
# versions are derived at build time - see versions/README.md. Each
# version's Minecraft / Fabric Loader / Fabric API live in
# versions/mc<version>.properties, not here.
mc=26.2
mc_canonical=26.2

# Fabric - see https://fabricmc.net/develop
loom_version=1.17-SNAPSHOT

# NeoForge - ModDevGradle for :neoforge and :deds-api-neoforge. 2.0.147 is the
# first version that can build NeoForge 26.3: 2.0.146's NeoForm runtime fails
# recompiling it. Each version's NeoForge itself lives in
# versions/mc<version>.properties.
moddev_version=2.0.147

# Project
# 0.2.0-beta: the first release on NeoForge as well as Fabric (0.1.0-beta
# was Fabric only). Still beta: playable and gametested, but not
# feature-frozen and not 1.0.
mod_version=0.2.0-beta
# Maven coordinates only; the Java package root is com.deds.morph.
maven_group=com.deds

# Ded's API versions INDEPENDENTLY of the mod. This is not cosmetic: the
# mod's fabric.mod.json declares `"deds_api": ">=2.0.0 <3.0.0"`, so if the
# nested API jar carried `mod_version` instead, Fabric Loader would refuse to
# load the mod at startup.
#
# 2.1.0 next to `>=2.0.0 <3.0.0` above is NOT a mismatch, so do not "correct"
# either one to match the other. The declaration is a RANGE and the API is
# additive-only inside a major version, so every 2.x satisfies it. This key
# has to describe the API source actually sitting in `deds-api/`; it is not
# a record of what this mod was once built against. If that source is ever
# replaced with a newer API, bump this in the same change: a number that
# claims 2.1.0 over vendored 2.0.0 source is worse than a stale number,
# because the loader keeps the highest-versioned copy of `deds_api` and would
# hand it to a mod that needs the members it does not contain.
api_version=2.1.0
