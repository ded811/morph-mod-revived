pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'morph-mod-revived'

// Ded's API is vendored into this repository (see NOTICE section 3(b)) so
// that a fresh clone builds with no external Maven setup.
// Like the mod it is LGPL-3.0, but it is Ded811's own work, independent of
// the mod in `src/`, and contains no code derived from Morph.
include ':deds-api'
